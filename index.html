<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新楓之谷工具箱</title>
    <link rel="icon" href="images/hexa.webp" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #111827;
        --bg-secondary: #1f2937;
        --border: #374151;
        --text-muted: #9ca3af;
        --accent: #6366f1;
        --accent-soft: rgba(99, 102, 241, 0.18);
        --gold: #fcd34d;
      }
      body {
        font-family: "Noto Sans TC", sans-serif;
        background:
          radial-gradient(circle at top, rgba(99, 102, 241, 0.22), transparent 36%),
          radial-gradient(circle at bottom right, rgba(245, 158, 11, 0.14), transparent 26%),
          var(--bg-primary);
        color: #e2e8f0;
      }
      .hero-panel {
        background: linear-gradient(180deg, rgba(31, 41, 55, 0.88), rgba(17, 24, 39, 0.94));
        border: 1px solid rgba(99, 102, 241, 0.18);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(12px);
      }
      .tool-card {
        background:
          linear-gradient(180deg, rgba(31, 41, 55, 0.98), rgba(17, 24, 39, 0.98));
        border: 1px solid var(--border);
        border-radius: 1rem;
        transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        text-decoration: none;
        display: block;
        position: relative;
        overflow: hidden;
      }
      .tool-card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 4px;
        background: linear-gradient(90deg, var(--accent), var(--gold));
        opacity: 0.9;
      }
      .tool-card:hover {
        border-color: var(--accent);
        transform: translateY(-4px);
        box-shadow: 0 16px 44px var(--accent-soft);
      }
      .tool-card:active {
        transform: translateY(-1px);
      }
      .tool-arrow {
        color: #c7d2fe;
        transition: transform 0.2s ease;
      }
      .tool-card:hover .tool-arrow {
        transform: translateX(4px);
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <div class="flex-1 flex flex-col items-center justify-center px-6 py-16">
      <section class="hero-panel rounded-3xl w-full max-w-5xl px-6 py-10 sm:px-10 sm:py-12">
        <header class="text-center max-w-2xl mx-auto mb-12">
          <img
            src="images/hexa.webp"
            alt="hexa"
            class="w-16 h-16 mx-auto mb-5"
          />
          <h1 class="text-4xl sm:text-5xl font-bold text-yellow-300 tracking-tight">
            新楓之谷工具箱
          </h1>
        </header>

        <main class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full">
          <a href="hexaCalculator/" class="tool-card p-8 text-center sm:text-left">
            <div class="flex justify-center sm:justify-start mb-5">
              <div class="rounded-2xl bg-indigo-500/10 border border-indigo-400/20 p-4">
                <svg
                  class="w-14 h-14 text-indigo-400"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"
                  />
                </svg>
              </div>
            </div>
            <p class="text-xs uppercase tracking-[0.3em] text-indigo-300 mb-3">
              HEXA Core
            </p>
            <h2 class="text-2xl font-bold text-yellow-300 mb-3">
              六轉核心計算器
            </h2>
            <div class="mt-6 flex items-center justify-center sm:justify-start gap-2 text-indigo-200 font-medium">
              <span>進入工具</span>
              <span class="tool-arrow">→</span>
            </div>
          </a>

          <a href="starforceEmulator/" class="tool-card p-8 text-center sm:text-left">
            <div class="flex justify-center sm:justify-start mb-5">
              <div class="rounded-2xl bg-amber-400/10 border border-amber-300/20 p-4">
                <svg
                  class="w-14 h-14 text-yellow-400"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.562.562 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"
                  />
                </svg>
              </div>
            </div>
            <p class="text-xs uppercase tracking-[0.3em] text-yellow-200 mb-3">
              Star Force
            </p>
            <h2 class="text-2xl font-bold text-yellow-300 mb-3">星力模擬器</h2>
            <div class="mt-6 flex items-center justify-center sm:justify-start gap-2 text-yellow-100 font-medium">
              <span>進入工具</span>
              <span class="tool-arrow">→</span>
            </div>
          </a>
        </main>
      </section>
    </div>

    <footer class="text-center pb-8 text-xs text-gray-600">
      <a
        href="https://home.gamer.com.tw/homeindex.php?owner=bighta83330"
        class="hover:text-indigo-400 transition-colors"
        >歪歪</a
      >
      製作
    </footer>
  </body>
</html>
