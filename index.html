<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>六轉核心計算器</title>
    <link rel="icon" href="images/hexa.webp" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans TC", sans-serif;
        background-color: #111827;
        color: #e2e8f0;
      }
      .card {
        background-color: #1f2937;
        border: 1px solid #374151;
      }
      .input-field {
        background-color: #111827;
        border: 1px solid #4b5563;
        color: #f9fafb;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .input-field:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
      }
      .input-field::placeholder {
        color: #6b7280;
      }
      .btn-primary {
        background-color: #4f46e5;
        transition: background-color 0.15s, transform 0.05s;
      }
      .btn-primary:hover {
        background-color: #6366f1;
      }
      .btn-primary:active {
        transform: translateY(1px);
      }
      progress {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 14px;
        border: none;
        border-radius: 9999px;
        overflow: hidden;
        background-color: #374151;
      }
      progress::-webkit-progress-bar {
        background-color: #374151;
        border-radius: 9999px;
      }
      progress::-webkit-progress-value {
        background: linear-gradient(90deg, #6366f1, #a855f7);
        border-radius: 9999px;
        transition: width 0.3s ease;
      }
      progress::-moz-progress-bar {
        background: linear-gradient(90deg, #6366f1, #a855f7);
        border-radius: 9999px;
      }
      /* hide native number spinners — keeps the UI tidy */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
      <header class="text-center mb-8">
        <h1
          class="text-3xl sm:text-4xl font-bold text-yellow-300 flex items-center justify-center gap-3"
        >
          <img src="images/hexa.webp" alt="hexa" class="w-9 h-9" />
          六轉核心計算器
        </h1>
        <p class="text-gray-400 mt-2 text-sm sm:text-base">
          精算滿等所需碎片數、目前進度與核心分布
        </p>
      </header>

      <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <section class="card rounded-lg p-6">
          <h2
            class="text-lg font-semibold text-yellow-300 border-b border-gray-700 pb-2 mb-4"
          >
            技能核心
          </h2>
          <div id="cores-skill" class="space-y-4"></div>
        </section>

        <section class="card rounded-lg p-6">
          <h2
            class="text-lg font-semibold text-yellow-300 border-b border-gray-700 pb-2 mb-4"
          >
            精通核心
          </h2>
          <div id="cores-mastery" class="space-y-4"></div>
        </section>

        <section class="card rounded-lg p-6">
          <h2
            class="text-lg font-semibold text-yellow-300 border-b border-gray-700 pb-2 mb-4"
          >
            強化核心
          </h2>
          <div id="cores-enhance" class="space-y-4"></div>
        </section>

        <section class="card rounded-lg p-6">
          <h2
            class="text-lg font-semibold text-yellow-300 border-b border-gray-700 pb-2 mb-4"
          >
            共通核心
          </h2>
          <div id="cores-common" class="space-y-4"></div>
        </section>
      </main>

      <div
        class="card rounded-lg p-6 mt-6 flex flex-col sm:flex-row items-stretch sm:items-center gap-4"
      >
        <div class="flex items-center gap-3 flex-1">
          <label
            for="havePieces"
            class="text-gray-200 whitespace-nowrap font-medium"
            >尚持有碎片</label
          >
          <input
            id="havePieces"
            type="number"
            min="0"
            placeholder="0"
            class="input-field rounded-md px-3 py-2 flex-1"
          />
        </div>
        <button
          onclick="go()"
          class="btn-primary rounded-md px-8 py-2.5 font-semibold text-white sm:w-auto"
        >
          計算
        </button>
      </div>

      <section id="results" class="card rounded-lg p-6 mt-6 space-y-6">
        <h2
          class="text-lg font-semibold text-yellow-300 border-b border-gray-700 pb-2"
        >
          進度總覽
        </h2>

        <div>
          <div class="flex items-baseline justify-between mb-2">
            <span class="text-sm text-gray-300">碎片進度</span>
            <span class="text-sm"
              ><span id="ooo1" class="text-yellow-300 font-semibold">0.00%</span
              ><span id="ooo2"></span
            ></span>
          </div>
          <progress max="37608" value="0" id="vvv"></progress>
        </div>

        <div>
          <div class="flex items-baseline justify-between mb-2">
            <span class="text-sm text-gray-300">不含共通技能碎片進度</span>
            <span class="text-sm"
              ><span id="ppp1" class="text-yellow-300 font-semibold">0.00%</span
              ><span id="ppp2"></span
            ></span>
          </div>
          <progress max="26940" value="0" id="xxx"></progress>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-gray-900 border border-gray-700 rounded-md p-4">
            <div class="text-gray-400 text-sm mb-1">獲取碎片數量</div>
            <div id="all" class="text-2xl font-bold text-white">-</div>
          </div>
          <div class="bg-gray-900 border border-gray-700 rounded-md p-4">
            <div class="text-gray-400 text-sm mb-1">還需碎片數量</div>
            <div id="all2" class="text-2xl font-bold text-white">-</div>
          </div>
        </div>

        <div
          id="no1"
          class="text-center text-base sm:text-lg text-pink-300 italic min-h-6"
        ></div>

        <div id="chart" class="w-full" style="min-height: 320px"></div>
      </section>

      <footer
        class="text-center mt-8 mb-4 text-xs sm:text-sm text-gray-500 flex flex-wrap items-center justify-center gap-x-3 gap-y-1"
      >
        <span id="no2" style="display: none"
          ><a
            class="hover:text-indigo-400 transition-colors"
            href="https://home.gamer.com.tw/homeindex.php?owner=super789x"
            >惡魔品質</a
          >
          製作</span
        >
        <span class="text-gray-700" aria-hidden="true">·</span>
        <span id="no3" style="display: none"
          ><a
            class="hover:text-indigo-400 transition-colors"
            href="https://home.gamer.com.tw/homeindex.php?owner=bighta83330"
            >歪歪</a
          >
          修改 20250331</span
        >
      </footer>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/orbcharts@3.0.8/dist/orbcharts.umd.min.js"></script>
    <script src="script.js"></script>
    <script src="chart.js"></script>
  </body>
</html>
